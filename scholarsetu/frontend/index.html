<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScholarSetu – SIH 2026 Prototype</title>
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#17261f;--mut:#5d6f66;--g:#1c6b47;--gl:#dcefe4;--o:#e0891b;--ol:#fbeacf;--r:#b5432f;--rl:#f7dfd9;--b:#d3ded7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#18241d;--ink:#e8f0eb;--mut:#9bb0a5;--g:#4fc08a;--gl:#1b3a2b;--o:#f0a53c;--ol:#3a2c14;--r:#e57a64;--rl:#3b1f19;--b:#2b3d33}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#18241d;--ink:#e8f0eb;--mut:#9bb0a5;--g:#4fc08a;--gl:#1b3a2b;--o:#f0a53c;--ol:#3a2c14;--r:#e57a64;--rl:#3b1f19;--b:#2b3d33}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans","Segoe UI",Roboto,sans-serif;font-size:15px;display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
header{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;background:var(--g);color:#fff}
header b{font-family:Georgia,"Times New Roman",serif;font-size:21px;letter-spacing:.2px;flex:1}
header small{display:block;font-size:11px;opacity:.85;font-family:"Noto Sans",sans-serif;font-weight:400}
.tg{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:14px;padding:5px 10px;font-size:12px;cursor:pointer}
#off{display:none;background:var(--ol);color:var(--ink);font-size:12px;padding:6px 16px;border-bottom:1px solid var(--o)}
main{flex:1;overflow-y:auto;padding:14px 14px 18px}
nav{display:flex;border-top:1px solid var(--b);background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 8px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}nav button.on{color:var(--g);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--o);outline-offset:2px}
h2{font-family:Georgia,serif;font-size:19px;margin:2px 0 10px}
h3{font-size:14px;margin:16px 0 8px;color:var(--mut);font-weight:600}
.c{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--gl);color:var(--g);font-weight:600}
.pill.o{background:var(--ol);color:#8a5200}.pill.r{background:var(--rl);color:var(--r)}
@media (prefers-color-scheme:dark){.pill.o{color:var(--o)}}
.steps{display:flex;margin-top:10px}
.st{flex:1;text-align:center;font-size:10px;color:var(--mut);position:relative}
.st i{display:block;width:14px;height:14px;border-radius:50%;background:var(--b);margin:0 auto 3px;position:relative;z-index:1}
.st:not(:first-child)::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:3px;background:var(--b)}
.st.d i,.st.d:not(:first-child)::before{background:var(--g)}.st.d{color:var(--ink)}
.st.n i{background:var(--o);box-shadow:0 0 0 4px var(--ol)}.st.n:not(:first-child)::before{background:var(--g)}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;width:100%;cursor:pointer}
.btn.s{background:var(--gl);color:var(--g)}.btn.w{width:auto;padding:7px 12px;font-size:12px}
.alert{background:var(--ol);border:1px solid var(--o);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 3px}
input,select{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
.chk{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--b);font-size:13px}
.chk:last-child{border:0}.bar{height:8px;border-radius:5px;background:var(--b);overflow:hidden;width:70px}
.bar div{height:100%;background:var(--g);transition:width .8s}.bar.l div{background:var(--o)}
#chat{display:flex;flex-direction:column;gap:8px;min-height:240px}
.m{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-line}
.m.u{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--b);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--g);color:var(--g);background:none;border-radius:16px;padding:6px 11px;font-size:12px;cursor:pointer}
.ib{display:flex;gap:6px}.ib input{flex:1}.ib button{width:44px;border:0;border-radius:8px;background:var(--g);color:#fff;cursor:pointer;font-size:16px}
.hb{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}.hb .t{width:78px}.hb .f{height:14px;background:var(--r);border-radius:3px;transition:width .8s}.hb .g{flex:1;background:var(--b);border-radius:3px}
.tab{display:flex;gap:6px;margin-bottom:10px}.tab button{flex:1;padding:8px;border:1px solid var(--b);background:var(--card);color:var(--ink);border-radius:10px;font-size:13px;cursor:pointer}.tab button.on{background:var(--g);color:#fff;border-color:var(--g)}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:20px;font-size:13px;display:none;z-index:9;max-width:90%}
#app.wide{max-width:980px}#app.wide main{padding:14px 20px}
.gov{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:10px;gap:8px}.gov a{color:var(--g);font-weight:700;text-decoration:none}
.hero{background:linear-gradient(135deg,var(--g),#0e3f29);color:#fff;border-radius:16px;padding:22px 18px;margin-bottom:12px}.hero h1{font-family:Georgia,serif;font-size:26px;margin:0 0 8px}.hero p{margin:0 0 14px;opacity:.92;max-width:560px}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{width:auto;padding:11px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.tile{border:0;color:#fff;border-radius:12px;padding:16px 6px;font-size:15px;font-weight:600;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.stats div{background:var(--gl);border-radius:12px;padding:10px 12px;font-size:12px}.stats b{display:block;font-size:20px;font-family:Georgia,serif;color:var(--g)}
.g2,.g3,.g4{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.ann{padding:7px 0;border-bottom:1px dashed var(--b);font-size:13px;color:var(--g)}.ann:last-child{border:0}.mut{font-size:12px;color:var(--mut)}ul{padding-left:18px;margin:8px 0;font-size:13px}
.fab{position:fixed;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;border:0;background:var(--o);font-size:24px;cursor:pointer;box-shadow:0 3px 10px #0004}
.foot{font-size:11px;color:var(--mut);text-align:center;padding:16px 0 60px}
.lbox{max-width:420px;margin:10px auto}.cap{font:italic 700 20px Georgia,serif;letter-spacing:4px;padding:6px 12px;border-radius:6px;background:repeating-linear-gradient(45deg,var(--gl),var(--gl) 4px,var(--ol) 4px,var(--ol) 8px);text-decoration:line-through wavy;white-space:nowrap}
.sbar{display:flex;justify-content:space-between;align-items:center;background:var(--g);color:#fff;padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.dlb{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--b);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;cursor:pointer;text-align:left}.dlb small{display:block;color:var(--mut)}
.or{text-align:center;color:var(--mut);margin:10px 0}.fp{display:block;font-size:12px;margin:4px 0;color:var(--g)}.rad{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-bottom:6px}
.qkc{text-align:left;border:1px solid var(--b);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer}
.sheet{position:absolute;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet>div{background:var(--card);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}.toast{z-index:30}
header{flex-wrap:wrap}.btn,nav button,.tab button,.chip{min-height:44px}details summary{cursor:pointer}
@media(max-width:520px){#sub{display:none}header b{font-size:18px}#offb{font-size:0}#offb::before{content:"📴";font-size:14px}#lg{max-width:92px}}
@media(min-width:760px){#app{max-width:880px}#v.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-content:start}#v.cols>h2,#v.cols>h3,#v.cols>.alert,#v.cols>.row:not(.c),#v.cols>div[style*="font-size:13px"],#v.cols>.btn{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app">
<header><button class="tg" id="bk" style="display:none" aria-label="Go back">←</button><div style="font-size:26px">🌿</div><b>ScholarSetu<small id="sub">One app, five schemes · Prototype</small></b><button class="tg" id="hp" aria-label="Help">?</button><select class="tg" id="lg" aria-label="Language" style="width:auto;padding:5px"></select><button class="tg" id="lo" style="display:none">Logout</button><button class="tg" id="offb">Go offline</button><button class="tg" id="thm" aria-label="Toggle theme">◐</button></header>

const $=s=>document.querySelector(s);
const S=[ // schemes: name, authority, stage index (0 submitted,1 verified,2 sanctioned,3 DBT), note
{n:"Post-Matric (ST)",sys:"NSP",amt:"₹ 14,500 / yr",st:3,note:"₹ 7,250 credited to SBI ••4821 on 12 Sep",ok:1},
{n:"Top Class Education",sys:"NSP",amt:"Up to ₹ 3.7 L / yr",st:1,note:"Verified. Awaiting State sanction",ok:1},
{n:"Pre-Matric (ST)",sys:"NSP",amt:"₹ 2,250 / yr",st:-1,note:"Younger sibling: Birsa. Not yet applied",ok:0},
{n:"National Fellowship (NFST)",sys:"SFMP",amt:"₹ 37,000 / month",st:0,note:"Deficiency: UDID/Aadhaar seeding pending",ok:0,warn:1},
{n:"Overseas Scholarship (NOS)",sys:"NOS",amt:"Up to ₹ 20 L",st:-1,note:"Eligible after final-year marks upload",ok:0}];
const STEPS=["Submit","Verify","Sanction","DBT"];
let off=false,lang="en",tab="home",chatInit=false;
const T={en:{home:"Home",apply:"Apply",jago:"JAGO",wallet:"Wallet",officer:"Officer"},hi:{home:"होम",apply:"आवेदन",jago:"जागो",wallet:"वॉलेट",officer:"अधिकारी"}};
const ICON={home:"🏠",apply:"📝",jago:"💬",wallet:"🗂️",officer:"🏛️"};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2600)}
function stepper(i){return `<div class="steps">${STEPS.map((s,k)=>`<div class="st ${k<=i?"d":k==i+1?"n":""}"><i></i>${s}</div>`).join("")}</div>`}
const R={portal(){},login(){},
home(){
 $("#v").innerHTML=`<h2>Namaste, Asha Munda 👋</h2>
 <div class="c row"><div class="sp"><b>OTR 1234 5678 9012 34</b><div style="font-size:12px;color:var(--mut)">Class 12 → B.Sc · Ranchi, Jharkhand · ST (Munda)</div></div><span class="pill">Verified</span></div>
 <div class="alert">⚠️ <b>1 action needed:</b> NFST needs UDID/Aadhaar seeding. <a href="#" onclick="go('jago');ask('nfst');return false" style="color:var(--g);font-weight:700">Ask JAGO how</a></div>
 <div class="row"><div class="c sp" style="text-align:center"><b style="font-size:22px">₹ 7,250</b><div style="font-size:12px;color:var(--mut)">Received this year</div></div><div class="c sp" style="text-align:center"><b style="font-size:22px">₹ 7,250</b><div style="font-size:12px;color:var(--mut)">Expected next</div></div></div>
 <h3>Your schemes, in one place</h3>`+S.map((s,i)=>`<div class="c"><div class="row"><b class="sp">${s.n}</b><span class="pill ${s.warn?"r":s.st<0?"o":""}">${s.st<0?"Not applied":s.warn?"Action needed":STEPS[s.st]+" done"}</span></div><div style="font-size:12px;color:var(--mut);margin-top:2px">${s.sys} · ${s.amt}</div>${s.st>=0?stepper(s.st):""}<div style="font-size:12.5px;margin-top:8px">${s.note}</div>${s.st<0?`<button class="btn s w" style="margin-top:8px" onclick="go('apply');pick(${i})">Apply now</button>`:""}</div>`).join("")+
 `<div class="c"><b>Family view</b><div style="font-size:13px;color:var(--mut);margin-top:4px">Birsa Munda (Class 8): Pre-Matric eligible. Parent can apply with the same wallet documents.</div></div>`},
apply(){
 $("#v").innerHTML=`<h2>Apply for a scheme</h2><label>Scheme</label><select id="sc" onchange="pick(this.value)">${S.map((s,i)=>`<option value="${i}" ${S[i].st>=0?"disabled":""}>${s.n}${s.st>=0?" (already applied)":""}</option>`).join("")}</select><div id="ap"></div>`;
 pick(S.findIndex(s=>s.st<0))},
wallet(){
 const D=[["Aadhaar (eKYC)","UIDAI","Used in 4"],["ST Caste Certificate","e-District, Jharkhand","Used in 3"],["Income Certificate","e-District","Used in 3"],["Class 12 Marksheet","DigiLocker (CBSE)","Used in 3"],["Enrolment / APAAR ID","APAAR · AISHE","Used in 2"],["Bank passbook","Uploaded","Used in 4"]];
 $("#v").innerHTML=`<h2>Document wallet</h2><div style="font-size:13px;color:var(--mut);margin-bottom:10px">Fetched once through DigiLocker with your consent. Reused in one tap.</div>`+D.map(d=>`<div class="c row"><div style="font-size:22px">📄</div><div class="sp"><b>${d[0]}</b><div style="font-size:12px;color:var(--mut)">${d[1]}</div></div><span class="pill">${d[2]}</span></div>`).join("")+`<button class="btn s" onclick="toast('Consent log: 6 fetches, all by you')">View consent &amp; audit log</button>`},
jago(){
 $("#v").innerHTML=`<div class="row"><h2 class="sp">JAGO assistant</h2></div>
 <div id="chat"></div><div class="chips" id="ch"></div><div class="ib"><input id="q" placeholder="${eff()=="en"?"Type or tap 🎤":"लिखें या 🎤 दबाएँ"}" onkeydown="if(event.key=='Enter')send()"><button onclick="mic()" aria-label="Voice">🎤</button><button onclick="send()" aria-label="Send">➤</button></div>`;
 const g=eff()=="en"?"Namaste Asha! I can see your 5 schemes. Ask me about status, documents or payments.":"नमस्ते आशा! मैं आपकी 5 योजनाएँ देख सकता हूँ। स्थिति, दस्तावेज़ या भुगतान के बारे में पूछें।";
 add("a",g);chips()},
officer(){
 $("#v").innerHTML=`<h2>Institute &amp; officer console</h2><div class="tab"><button id="t1" class="on" onclick="oq(1)">Review queue</button><button id="t2" onclick="oq(2)">Gap-finder</button></div><div id="oc"></div>`;oq(1)}
};
/* APPLY */
function pick(i){
 i=+i;if(i<0||isNaN(i)){$("#ap").innerHTML="<div class='c'>All schemes applied.</div>";return}
 $("#sc").value=i;const s=S[i];
 $("#ap").innerHTML=`<div class="c"><b>Eligibility check</b><div class="chk">✅ ST category (certificate on file)</div><div class="chk">✅ Family income ≤ ₹ 2.5 L</div><div class="chk">✅ Enrolled in recognised institute</div><div class="chk">✅ No other overlapping scheme</div></div>
 <div class="c"><b>Pre-filled form</b><label>Name</label><input value="Asha Munda" readonly><label>Date of birth</label><input value="14-03-2005" readonly><label>Institute (UDISE+/AISHE)</label><input value="Ranchi Women's College · C-12345" readonly><label>Bank account</label><input value="SBI ••4821 (DBT seeded)" readonly></div>
 <button class="btn" id="vb" onclick="verify(${i})">Verify with one tap</button><div id="vr"></div>`}
function verify(i){
 $("#vb").disabled=true;$("#vb").textContent="Checking sources in parallel…";
 const C=[["DigiLocker · certificate",98,0],["UIDAI · Aadhaar name",96,0],["UDISE+/AISHE · institute",94,0],["APAAR · enrolment",91,0],["e-District · income",72,1]];
 $("#vr").innerHTML=`<div class="c" style="margin-top:10px"><b>Unified verification</b>${C.map((c,k)=>`<div class="chk"><span class="sp">${c[0]}</span><div class="bar ${c[2]?"l":""}"><div id="b${k}" style="width:0"></div></div><b id="p${k}" style="width:62px;text-align:right;font-size:12px">…</b></div>`).join("")}<div id="res"></div></div>`;
 C.forEach((c,k)=>setTimeout(()=>{$("#b"+k).style.width=c[1]+"%";$("#p"+k).innerHTML=c[2]?`${c[1]}% ⚠️`:`${c[1]}% ✓`;
  if(k==4)setTimeout(()=>{$("#res").innerHTML=`<div class="alert" style="margin:10px 0 0"><b>${P().mm}</b> 72% match. It does not block you. Sent to a nodal officer for manual review.</div><button class="btn" style="margin-top:10px" onclick="submitApp(${i})">Submit application</button>`},500)},500+k*450))}
function submitApp(i){
 const id="SSU"+Math.floor(26000000+Math.random()*9e6);S[i].st=0;S[i].note="Submitted. Income certificate in manual review";S[i].warn=0;
 $("#vr").innerHTML=`<div class="c" style="margin-top:10px;background:var(--gl)"><b>✅ Application submitted</b><div style="font-size:13px;margin-top:4px">ID <b>${id}</b>. SMS and push alert sent. Track it on Home.</div><button class="btn" style="margin-top:8px" onclick="go('home')">Go to Home</button></div>`;
 $("#vb").style.display="none";toast("Alert sent: application "+id)}
/* CHAT */
const KB={
 status:{k:["status","स्थिति","track","कहाँ"],en:"Your status:\n• Post-Matric: DBT done (₹ 7,250 on 12 Sep)\n• Top Class: verified, awaiting State sanction\n• NFST: deficiency, needs UDID seeding\n• Pre-Matric (Birsa) and NOS: not applied",hi:"आपकी स्थिति:\n• पोस्ट-मैट्रिक: DBT हो गया (12 सितंबर को ₹ 7,250)\n• टॉप क्लास: सत्यापित, राज्य स्वीकृति बाकी\n• NFST: UDID सीडिंग बाकी\n• प्री-मैट्रिक (बिरसा) और NOS: आवेदन नहीं किया"},
 nfst:{k:["nfst","fellowship","udid","deficien","कमी"],en:"NFST is stuck on Aadhaar/UDID seeding. Steps:\n1. Open Wallet and confirm Aadhaar is linked\n2. Seed your bank with Aadhaar via NPCI BASE\n3. Tap re-submit. I'll alert you once it's cleared.",hi:"NFST में आधार/UDID सीडिंग बाकी है:\n1. वॉलेट में आधार जाँचें\n2. NPCI BASE से बैंक को आधार से जोड़ें\n3. फिर से जमा करें। मंजूरी पर मैं सूचना दूँगा।"},
 pay:{k:["pay","money","dbt","paid","पैसा","भुगतान","राशि"],en:"₹ 7,250 was credited to SBI ••4821 on 12 Sep. The second instalment of ₹ 7,250 is expected after Top Class sanction. No need to check PFMS separately.",hi:"12 सितंबर को SBI ••4821 में ₹ 7,250 जमा हुए। दूसरी किस्त ₹ 7,250 स्वीकृति के बाद आएगी। PFMS अलग से देखने की ज़रूरत नहीं।"},
 docs:{k:["document","doc","दस्तावेज़","certificate","प्रमाण"],en:"Your wallet has 6 verified documents. For NOS you still need: final-year marksheet and passport. Both can be pulled from DigiLocker.",hi:"वॉलेट में 6 सत्यापित दस्तावेज़ हैं। NOS के लिए अंतिम वर्ष की मार्कशीट और पासपोर्ट चाहिए, दोनों DigiLocker से मिल जाएँगे।"},
